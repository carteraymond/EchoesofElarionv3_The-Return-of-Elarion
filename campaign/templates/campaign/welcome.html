{% extends "base.html" %}

{% block title %}
Begin Your Journey | Echoes of Elarion
{% endblock %}

{% block content %}

<h2>Welcome to Echoes of Elarion</h2>

<p>
    Before you begin your journey, tell us your name.
</p>

<form method="POST">
    {% csrf_token %}

    <label for="name">Adventurer Name:</label>
    <input type="text" id="name" name="name" required>

    <button type="submit">Begin Your Journey</button>
</form>

{% endblock %}
